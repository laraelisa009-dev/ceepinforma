<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CEEP Informa - Autenticação</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="auth-container">
    <!-- Formulário de Login -->
    <form id="form-login" class="auth-form">
      <h2>Entrar no CEEP Informa</h2>
      <input type="email" id="login-email" placeholder="E-mail" required>
      <input type="password" id="login-senha" placeholder="Senha" required>
      <button type="submit">Entrar</button>
      <p class="toggle-text">
        Ainda não tem conta? <a href="#" id="link-ir-cadastro">Cadastre-se</a>
      </p>
    </form>

    <!-- Formulário de Cadastro (Oculto por padrão) -->
    <form id="form-cadastro" class="auth-form hidden">
      <h2>Criar Conta</h2>
      <input type="text" id="cad-nome" placeholder="Nome Completo" required>
      <input type="email" id="cad-email" placeholder="E-mail" required>
      <input type="password" id="cad-senha" placeholder="Senha" required>
      <button type="submit">Cadastrar</button>
      <p class="toggle-text">
        Já possui uma conta? <a href="#" id="link-ir-login">Fazer Login</a>
      </p>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
