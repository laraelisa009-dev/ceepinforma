<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CEEP Informa - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="main-container">

    <!-- Painel Azul -->
    <div class="brand-panel">
      <div class="brand-content">
        <h1 class="brand-title">ceep<br>Informa</h1>
        <p class="brand-subtitle">Plataforma de Avisos Escolares</p>
        <blockquote class="brand-quote">
          "A informação é a base para uma escola mais unida e conectada."
        </blockquote>
      </div>
    </div>

    <!-- Painel Escuro / Login -->
    <div class="login-panel">
      <div class="login-content">
        <h2 class="login-title">Entrar na conta</h2>
        <p class="login-description">
          Insira seus dados para acessar o mural de avisos.
        </p>

        <form class="login-form" id="form-login">
          <div class="input-group">
            <input type="email" id="login-email" placeholder="E-mail" required>
          </div>

          <div class="input-group">
            <input type="password" id="login-senha" placeholder="Sua senha" required>
          </div>

          <button type="submit" class="btn-primary">Entrar</button>
        </form>

        <div class="signup-link">
          <p>Ainda não tem uma conta?</p>
          <a href="cadastro.html">Cadastre-se</a>
        </div>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
